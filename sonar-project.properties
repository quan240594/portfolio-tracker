# For a local scan, run scripts/sonar-scan.sh (reads the token from the
# gitignored .env.sonar.local - see that script's header for one-time setup).
sonar.organization=quan240594
sonar.projectKey=quan240594_portfolio-tracker
sonar.projectName=Portfolio Tracker

sonar.sources=packages/shared/src,packages/platform/src,packages/aws/src,services/api/src,services/api/scripts,services/ingest/src,services/broker-sync/src,scripts/lambda,services/prices/prices,services/prices/tests,web/src,web/e2e,web/e2e-auth,infra
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,web/e2e/**,web/e2e-auth/**,services/prices/tests/**,web/src/test/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.venv/**,**/__pycache__/**,**/.terraform/**,web/public/mockServiceWorker.js,platform/cloudflare/spike/**

# Dev-only entry points, fixtures and test helpers are not production code paths.
sonar.coverage.exclusions=web/src/mocks/**,web/src/main.tsx,**/testing/**,services/api/src/local.ts,services/ingest/src/local-poller.ts,services/broker-sync/src/cli.ts,services/*/scripts/**,scripts/**,services/prices/prices/local.py,infra/**,platform/cloudflare/spike/**
sonar.cpd.exclusions=web/src/mocks/**,**/testing/**,platform/cloudflare/spike/**

sonar.sourceEncoding=UTF-8

# Produced by `pnpm test:coverage` (one lcov.info per workspace package; new packages are picked up by the globs).
sonar.javascript.lcov.reportPaths=packages/*/coverage/lcov.info,services/*/coverage/lcov.info,web/coverage/lcov.info

# Produced by `pytest --cov=prices --cov-report=xml:coverage.xml` inside services/prices.
sonar.python.coverage.reportPaths=services/prices/coverage.xml
sonar.python.version=3.12
